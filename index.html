<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.P.A.R.K. Academy</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      --background: #050505;
      --foreground: #f5f7fb;
      --muted: rgba(255, 255, 255, 0.72);
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--foreground);
      background:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        #050505;
      background-size: 120px 120px;
    }

    main {
      width: min(720px, 100%);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.05));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-flex;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 8px 14px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(34px, 7vw, 56px);
      line-height: 1.02;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    code {
      display: block;
      margin-top: 18px;
      padding: 14px 16px;
      overflow-x: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.07);
      color: #f8fbff;
      font-size: 14px;
      white-space: nowrap;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin-top: 22px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 18px;
      background: #ffffff;
      color: #050505;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">S.P.A.R.K. Academy</span>
    <h1>Открой актуальную версию сайта</h1>
    <p>
      Главная страница проекта теперь работает через Next.js. Запусти локальный сервер из этой папки,
      затем открой сайт по адресу localhost.
    </p>
    <code>npm install && npm run dev</code>
    <a href="http://localhost:3000">Открыть localhost:3000</a>
  </main>
  <script>
    if (window.location.protocol === "file:") {
      fetch("http://localhost:3000", { mode: "no-cors" })
        .then(function () {
          window.location.href = "http://localhost:3000";
        })
        .catch(function () {});
    }
  </script>
</body>
</html>
